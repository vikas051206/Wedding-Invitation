<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print QR — Rachana & Nitin</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fffdf9;
            font-family: 'Cinzel', serif;
            color: #7a1c2e;
            padding: 24px;
        }
        .card {
            text-align: center;
            max-width: 360px;
            padding: 32px 24px;
            border: 2px solid #d4af37;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 12px 40px rgba(74, 16, 26, 0.12);
        }
        h1 { font-size: 1.25rem; margin-bottom: 8px; letter-spacing: 0.06em; }
        p { font-size: 0.75rem; color: #5c4a4a; margin-bottom: 20px; line-height: 1.5; }
        img { width: 240px; height: 240px; display: block; margin: 0 auto 16px; border-radius: 8px; }
        .url { font-size: 0.65rem; word-break: break-all; color: #9b2d42; }
        @media print {
            body { background: white; }
            .card { box-shadow: none; border-width: 1px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Rachana & Nitin</h1>
        <p>Scan to open the wedding invitation on your phone</p>
        <img id="qr" src="" alt="QR code">
        <p class="url" id="app-url"></p>
    </div>
    <script>
        const appUrl = window.location.origin + '/';
        document.getElementById('app-url').textContent = appUrl;
        document.getElementById('qr').src =
            'https://api.qrserver.com/v1/create-qr-code/?size=400x400&color=7a1c2e&bgcolor=ffffff&data=' +
            encodeURIComponent(appUrl);
    </script>
</body>
</html>
